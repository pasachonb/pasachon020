
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Mellow Cafe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #dceeff;
        }

        .banner {
            width: 100%;
            min-height: 100vh;
        }

        .banner img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <div class="banner">
        <img src="images/banner.png" alt="Milky Mellow Cafe">
    </div>

</body>
</html>
